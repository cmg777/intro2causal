<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 154 20" width="154" height="20">
  <defs>
    <clipPath id="r">
      <rect width="154" height="20" rx="3"/>
    </clipPath>
  </defs>
  <g clip-path="url(#r)">
    <!-- Red left section -->
    <rect width="54" height="20" fill="#dc2626"/>
    <!-- Lighter red right section -->
    <rect x="54" width="100" height="20" fill="#ef4444"/>
    <!-- Video icon: screen with play triangle -->
    <rect x="10.5" y="4.5" width="15" height="11" rx="2.5" fill="none" stroke="#fff" stroke-width="1.3"/>
    <path d="M16,7.5 L21,10 L16,12.5 Z" fill="#fff"/>
    <!-- Arrow icon -->
    <text x="35" y="14" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="11" fill="#fff">&#9654;</text>
    <!-- Right text -->
    <text x="62" y="14" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="11" fill="#fff">Watch Video</text>
  </g>
</svg>
