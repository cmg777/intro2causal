<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 154 20" width="154" height="20">
  <defs>
    <clipPath id="r">
      <rect width="154" height="20" rx="3"/>
    </clipPath>
  </defs>
  <g clip-path="url(#r)">
    <!-- MethodPurple left section -->
    <rect width="54" height="20" fill="#7c3aed"/>
    <!-- Lighter purple right section -->
    <rect x="54" width="100" height="20" fill="#8b5cf6"/>
    <!-- Slides icon: presentation board on a stand -->
    <rect x="11" y="4" width="14" height="9" rx="1" fill="none" stroke="#fff" stroke-width="1.3"/>
    <line x1="18" y1="13" x2="18" y2="16" stroke="#fff" stroke-width="1.2"/>
    <line x1="15" y1="16.5" x2="21" y2="16.5" stroke="#fff" stroke-width="1.2"/>
    <!-- Arrow icon -->
    <text x="35" y="14" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="11" fill="#fff">&#9654;</text>
    <!-- Right text -->
    <text x="62" y="14" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" font-size="11" fill="#fff">View Slides</text>
  </g>
</svg>
